{% extends "base.html" %}
{% block title %}Meet the Team{% endblock %}
{% block content %}

<section class="hero">
  <h1>Meet the Team</h1>
  <h2>Section 4 · Team 1 · Fall 2025</h2>
  <hr class="divider">
</section>

<section class="team-grid">
  {% for m in members %}
  <article class="card">
    <div class="avatar">
      <svg width="50" height="50" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 
                 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 
                 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>
    <h3 class="name">{{ m.name }}</h3>
    <p class="role">{{ m.role }}</p>
    <a class="btn" href="#">View Profile</a>
  </article>
  {% endfor %}
</section>

<div class="back">
  <a href="/">← Back to Home</a>
</div>

{% endblock %}
