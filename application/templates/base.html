<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}Team About{% endblock %}</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="banner">
    <p>SFSU CSC 648/848 · Fall 2025 · Section 4 · Team 1</p>
  </div>

  <nav class="nav">
    <div class="nav-inner">
      <a class="logo" href="{{ url_for('team_page') }}">SFSU</a>
      <ul class="links">
        <li><a class="active" href="{{ url_for('team_page') }}">About</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>© 2025 SFSU · For demonstration only.</p>
  </footer>
</body>
</html>
