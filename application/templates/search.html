{% extends "base.html" %}
{% block title %}Search Tutors{% endblock %}
{% block content %}
<section class="hero">
  <h1>Search Tutors</h1>
  <h2>Find a tutor by subject, course, or keyword</h2>
</section>

<div class="container" style="padding: 24px 0 64px;">
  <form method="get" action="{{ url_for('results_page') }}">
    <input
      name="q"
      type="search"
      placeholder="e.g., CSC 340, Calculus, Python"
      style="width:100%;max-width:720px;height:48px;padding:0 16px;border:1px solid var(--divider);border-radius:12px;"
      aria-label="Search tutors"
    />
    <div style="margin-top:12px">
      <button class="btn" type="submit">Search</button>
    </div>
  </form>
</div>
{% endblock %}
